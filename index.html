<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>No0ne Games | 53+ Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: block;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            position: relative;
        }

        .back-to-proxy-btn {
            position: absolute;
            top: 20px;
            left: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 25px;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .back-to-proxy-btn:hover {
            background: #333;
            border-color: #666;
            transform: scale(1.05);
        }

        .back-to-proxy-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            position: relative;
            display: inline-block;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            padding: 20px;
        }

        .game-card {
            background: #111111;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: #666;
            box-shadow: 0 15px 30px rgba(255,255,255,0.1);
            background: #1a1a1a;
        }

        .game-icon {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-bottom: 2px solid #333;
            background: #222;
        }

        .game-info {
            padding: 15px;
            text-align: center;
        }

        .game-name {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .play-button {
            display: inline-block;
            padding: 5px 15px;
            background: #333;
            color: white;
            border-radius: 20px;
            font-size: 0.8rem;
            text-decoration: none;
            margin-top: 5px;
            transition: all 0.2s ease;
            border: 1px solid #555;
        }

        .game-card:hover .play-button {
            background: #444;
            border-color: #777;
        }

        .stats {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .game-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
        }

        .game-view.active {
            display: block;
        }

        .game-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1001;
            border-bottom: 1px solid #333;
        }

        .back-button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .back-button:hover {
            background: #444;
            border-color: #777;
            transform: scale(1.05);
        }

        .back-button:active {
            transform: scale(0.95);
        }

        .back-button svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .game-title {
            color: white;
            margin-left: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            flex-grow: 1;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            margin-top: 60px;
            background: #000;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #333;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .games-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 10px; }
            .game-name { font-size: 0.9rem; }
            .game-title { font-size: 1rem; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 2.2rem; }
            .games-grid { grid-template-columns: repeat(2, 1fr); }
            .game-header { padding: 0 10px; }
            .back-button { padding: 6px 12px; font-size: 0.9rem; }
        }
    </style>
</head>

        // Store games data
        let gamesData = [];

        // Build the games grid
        function buildGamesGrid() {
            const grid = document.getElementById('gamesGrid');
            const gameCountSpan = document.getElementById('gameCount');
            
            grid.innerHTML = '';
            gamesData = [];
            
            gamesList.forEach((game, index) => {
                // Build the URL: https://willybilly4653.github.io/games/FOLDERNAME/
                const gameUrl = `${GAMES_BASE}${game.folder}/`;
                
                gamesData.push({
                    name: game.name,
                    url: gameUrl
                });
                
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => playGame(index, game.name, gameUrl);
                
                card.innerHTML = `
                    <img class="game-icon" src="${game.icon}" alt="${game.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=${encodeURIComponent(game.name)}'">
                    <div class="game-info">
                        <div class="game-name">${game.name}</div>
                        <span class="play-button">Play</span>
                    </div>
                `;
                
                grid.appendChild(card);
            });
            
            gameCountSpan.textContent = `${gamesData.length} Games`;
        }

        // Play game function
        function playGame(index, name, url) {
            document.getElementById('gamesView').style.display = 'none';
            document.getElementById('gameView').classList.add('active');
            document.getElementById('gameTitle').textContent = name;
            document.getElementById('gameIframe').src = url;
            history.pushState({game: index}, name, '#game');
        }

        // Back to games function
        function backToGames() {
            document.getElementById('gamesView').style.display = 'block';
            document.getElementById('gameView').classList.remove('active');
            document.getElementById('gameIframe').src = 'about:blank';
            history.pushState({view: 'games'}, 'No0ne Games', '/');
        }

        // Handle browser back button
        window.addEventListener('popstate', function(event) {
            if (event.state && event.state.game !== undefined) {
                const game = gamesData[event.state.game];
                if (game) {
                    document.getElementById('gamesView').style.display = 'none';
                    document.getElementById('gameView').classList.add('active');
                    document.getElementById('gameTitle').textContent = game.name;
                    document.getElementById('gameIframe').src = game.url;
                }
            } else {
                document.getElementById('gamesView').style.display = 'block';
                document.getElementById('gameView').classList.remove('active');
                document.getElementById('gameIframe').src = 'about:blank';
            }
        });

        // Handle escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('gameView').classList.contains('active')) {
                backToGames();
            }
        });

        // Initialize
        buildGamesGrid();
    </script>
</body>
</html>
